name: Export Dependabot Alerts

on:
  workflow_dispatch:

jobs:
  export-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch and Convert Dependabot Alerts to CSV
        env:
          # Changed to match your exact secret name
          GH_TOKEN: ${{ secrets.DEPENDABOT_EXPORT_TOKEN }} 
        run: |
          echo "Fetching Dependabot alerts securely..."
          
          gh api repos/${{ github.repository }}/dependabot/alerts \
            --paginate \
            --jq 'if length == 0 then empty else .[] | [.number, .state, .dependency.package.name, .security_advisory.severity, .security_advisory.summary] | @csv end' > alerts_raw.csv

          echo '"Alert Number","State","Package Name","Severity","Summary"' > dependabot_alerts.csv
          cat alerts_raw.csv >> dependabot_alerts.csv

      - name: Upload CSV Report
        uses: actions/upload-artifact@v4
        with:
          name: dependabot-csv-report
          path: dependabot_alerts.csv
